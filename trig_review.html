<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角比・三平方の定理 復習学習教材</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=KaTeX_Math:ital,wght@1,400&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', 'Inter', sans-serif;
    }
    .math-font {
      font-family: 'KaTeX_Math', 'Times New Roman', serif;
      font-style: italic;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-8 px-4 flex flex-col items-center">

  <main class="w-full max-w-2xl bg-white border border-slate-200 shadow-md rounded-2xl p-6 sm:p-8">
    <header class="text-center mb-6">
      <div class="inline-flex items-center gap-2 bg-blue-50 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold mb-2">
        <span>高校数学Ⅰ</span>
        <span>•</span>
        <span>図形と計量 / 基礎復習</span>
      </div>
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">直角三角形と三角比・三平方の定理</h1>
      <p class="text-sm text-slate-500 mt-1">基準角 <span class="math-font text-base text-rose-600 font-semibold">θ</span> の位置と定義を正しく確認しましょう</p>
    </header>

    <!-- コントロールバー -->
    <section class="bg-slate-100 p-4 rounded-xl mb-6 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
      <div class="flex-1">
        <label for="mode-select" class="block text-xs font-medium text-slate-600 mb-1">問題形式の選択</label>
        <select id="mode-select" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
          <option value="mode1">① 3辺表示 → 三角比を求める</option>
          <option value="mode2">② 2辺表示 → 三平方の定理と三角比</option>
          <option value="mode3">③ 1辺 + 三角比 → 残りの辺を求める</option>
        </select>
      </div>
      <div class="flex items-end gap-2 pt-1 sm:pt-0">
        <button id="btn-next" class="flex-1 sm:flex-initial bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-sm font-semibold px-4 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          数値を変更
        </button>
      </div>
    </section>

    <!-- 図形キャンバス表示部 -->
    <div class="relative bg-slate-50 border border-slate-200 rounded-xl overflow-hidden shadow-inner flex justify-center items-center p-3 mb-6">
      <canvas id="triCanvas" width="560" height="320" class="w-full max-w-[560px] h-auto block"></canvas>
    </div>

    <!-- 演習問題 ＆ 解答・解説表示カード -->
    <section class="border border-slate-200 rounded-xl p-5 bg-white shadow-sm">
      <div class="flex items-center justify-between gap-2 mb-3">
        <span id="problem-tag" class="px-2.5 py-0.5 rounded text-xs font-bold bg-blue-100 text-blue-800">形式①</span>
        <button id="btn-toggle-ans" class="text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-lg transition border border-slate-300">
          解説・解答を表示
        </button>
      </div>

      <div id="question-text" class="text-base font-semibold text-slate-900 leading-relaxed mb-1">
        <!-- 問題文が動的挿入されます -->
      </div>

      <!-- 解答表示領域（トグル切り替え） -->
      <div id="answer-container" class="hidden mt-4 pt-4 border-t border-dashed border-slate-300 text-sm text-slate-700 bg-blue-50/50 p-4 rounded-lg">
        <div id="answer-content" class="space-y-2">
          <!-- 解説内容が動的挿入されます -->
        </div>
      </div>
    </section>

    <!-- 復習メモフッター -->
    <footer class="mt-6 text-xs text-slate-500 bg-slate-50 p-3 rounded-lg border border-slate-200">
      <p class="font-bold text-slate-700 mb-1">📐 三角比の定義の再確認（直角を右下、θ を左下に配置した場合）</p>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-1.5 text-slate-600">
        <div>• <span class="font-semibold text-blue-700">sin θ</span> = 対辺(高さ) / 斜辺</div>
        <div>• <span class="font-semibold text-blue-700">cos θ</span> = 隣辺(底辺) / 斜辺</div>
        <div>• <span class="font-semibold text-blue-700">tan θ</span> = 対辺(高さ) / 隣辺(底辺)</div>
      </div>
    </footer>
  </main>

<script>
/**
 * 辺の数式表現: k * √r
 * （例: {k: 1, r: 2} -> √2, {k: 2, r: 3} -> 2√3, {k: 5, r: 1} -> 5）
 */
function gcd(a, b) {
  a = Math.abs(a);
  b = Math.abs(b);
  return b === 0 ? a : gcd(b, a % b);
}

function sideToStr(s) {
  if (s.r === 1) return `${s.k}`;
  const pref = s.k === 1 ? "" : `${s.k}`;
  return `${pref}√${s.r}`;
}

function sideVal(s) {
  return s.k * Math.sqrt(s.r);
}

function sideSq(s) {
  return s.k * s.k * s.r;
}

// 2つの無理数比の既約分数形式（分母の有理化済み）
function formatRatio(num, den) {
  let kTop = num.k;
  let rTop = num.r * den.r;
  let kBottom = den.k * den.r;

  // 簡単な平方数の因数出し
  const squares = [25, 16, 9, 4];
  for (const sq of squares) {
    if (rTop % sq === 0) {
      kTop *= Math.sqrt(sq);
      rTop /= sq;
    }
  }

  const g = gcd(kTop, kBottom);
  kTop /= g;
  kBottom /= g;

  let topStr = "";
  if (rTop === 1) {
    topStr = `${kTop}`;
  } else {
    topStr = (kTop === 1 ? "" : `${kTop}`) + `√${rTop}`;
  }

  return kBottom === 1 ? topStr : `${topStr}/${kBottom}`;
}

// 直角三角形の基礎プリセット（底辺 a, 高さ b, 斜辺 c）
const PRESETS = [
  // ピタゴラス数 (3, 4, 5) 系
  { a: {k:4, r:1}, b: {k:3, r:1}, c: {k:5, r:1}, isRational: true },
  { a: {k:3, r:1}, b: {k:4, r:1}, c: {k:5, r:1}, isRational: true },
  // ピタゴラス数 (5, 12, 13) 系
  { a: {k:12, r:1}, b: {k:5, r:1}, c: {k:13, r:1}, isRational: true },
  { a: {k:5, r:1}, b: {k:12, r:1}, c: {k:13, r:1}, isRational: true },
  // ピタゴラス数 (8, 15, 17) 系
  { a: {k:8, r:1}, b: {k:15, r:1}, c: {k:17, r:1}, isRational: true },
  // 無理数基本形 (1 : 1 : √2) - 45°
  { a: {k:1, r:1}, b: {k:1, r:1}, c: {k:1, r:2}, isRational: false },
  // 無理数基本形 (√3 : 1 : 2) - 30°
  { a: {k:1, r:3}, b: {k:1, r:1}, c: {k:2, r:1}, isRational: false },
  // 無理数基本形 (1 : √3 : 2) - 60°
  { a: {k:1, r:1}, b: {k:1, r:3}, c: {k:2, r:1}, isRational: false },
  // 無理数基本形 (2 : 1 : √5)
  { a: {k:2, r:1}, b: {k:1, r:1}, c: {k:1, r:5}, isRational: false },
  // 無理数基本形 (1 : 2 : √5)
  { a: {k:1, r:1}, b: {k:2, r:1}, c: {k:1, r:5}, isRational: false }
];

let currentProblem = null;
let isAnswerShown = false;

function generateProblem(mode) {
  let pool = PRESETS;
  if (mode === "mode3") {
    // 形式③は綺麗な整数倍で整合させるため、有理比ピタゴラス数を採用
    pool = PRESETS.filter(p => p.isRational);
  }

  const base = pool[Math.floor(Math.random() * pool.length)];
  const scaleMultiplier = Math.floor(Math.random() * 3) + 1; // 1〜3倍

  const a = { k: base.a.k * scaleMultiplier, r: base.a.r };
  const b = { k: base.b.k * scaleMultiplier, r: base.b.r };
  const c = { k: base.c.k * scaleMultiplier, r: base.c.r };

  const sinVal = formatRatio(base.b, base.c);
  const cosVal = formatRatio(base.a, base.c);
  const tanVal = formatRatio(base.b, base.a);

  let hiddenSide = null;
  let targetSide = "b";
  let targetRatio = "sin";

  if (mode === "mode2") {
    const sides = ["a", "b", "c"];
    hiddenSide = sides[Math.floor(Math.random() * sides.length)];
  } else if (mode === "mode3") {
    const patterns = [
      { ratio: "sin", target: "b", given: "c" },
      { ratio: "sin", target: "c", given: "b" },
      { ratio: "cos", target: "a", given: "c" },
      { ratio: "cos", target: "c", given: "a" },
      { ratio: "tan", target: "b", given: "a" },
      { ratio: "tan", target: "a", given: "b" }
    ];
    const pick = patterns[Math.floor(Math.random() * patterns.length)];
    targetRatio = pick.ratio;
    targetSide = pick.target;
  }

  return {
    a, b, c, mode, hiddenSide, targetSide, targetRatio,
    sinVal, cosVal, tanVal, base
  };
}

function draw(p) {
  const canvas = document.getElementById("triCanvas");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const realA = sideVal(p.a);
  const realB = sideVal(p.b);

  // パディングと描画スケール
  const paddingX = 75;
  const paddingY = 60;
  const availW = canvas.width - paddingX * 2;
  const availH = canvas.height - paddingY * 2;
  const scale = Math.min(availW / realA, availH / realB);

  const drawA = realA * scale;
  const drawB = realB * scale;

  // 頂点座標 (左下: C(θ), 右下: R(直角), 右上: T)
  const leftX = (canvas.width - drawA) / 2;
  const baseY = canvas.height - (canvas.height - drawB) / 2;
  const rightX = leftX + drawA;
  const topY = baseY - drawB;

  // 1. 直角マークの描画
  const sq = Math.min(18, Math.min(drawA, drawB) * 0.22);
  ctx.strokeStyle = "#94a3b8";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(rightX - sq, baseY - sq, sq, sq);

  // 2. 三角形本体の描画
  ctx.beginPath();
  ctx.moveTo(leftX, baseY);
  ctx.lineTo(rightX, baseY);
  ctx.lineTo(rightX, topY);
  ctx.closePath();

  ctx.fillStyle = "#f8fafc";
  ctx.fill();
  ctx.strokeStyle = "#1e293b";
  ctx.lineWidth = 2.5;
  ctx.lineJoin = "round";
  ctx.stroke();

  // 3. 【最適化された θ と円弧の描画】
  // 角度の計算
  const thetaAngle = Math.atan2(drawB, drawA); // ラジアン (0 < theta < π/2)

  // 形状に応じて円弧の半径を安全に決定（底辺・高さ・斜辺の最小値から割れを防止）
  const minDim = Math.min(drawA, drawB);
  const arcRadius = Math.max(26, Math.min(46, minDim * 0.32));

  // 円弧の描画
  ctx.beginPath();
  ctx.arc(leftX, baseY, arcRadius, 0, -thetaAngle, true);
  ctx.strokeStyle = "#e11d48"; // 鮮やかなローズレッド
  ctx.lineWidth = 2;
  ctx.stroke();

  // 角の二等分線方向ベクトルに沿って θ を配置
  // 二等分線の角度: 半角 θ / 2
  const halfAngle = thetaAngle / 2;
  // θ の距離: 円弧の少し外側で、かつ対辺や斜辺に触れない位置
  const labelDistance = arcRadius + 16;
  const thetaX = leftX + labelDistance * Math.cos(halfAngle);
  const thetaY = baseY - labelDistance * Math.sin(halfAngle);

  ctx.save();
  ctx.fillStyle = "#e11d48";
  ctx.font = "italic bold 19px 'KaTeX_Math', 'Times New Roman', serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("θ", thetaX, thetaY);
  ctx.restore();

  // 4. 各辺の長さラベルの配置
  const labelA = getSideLabel(p, "a");
  const labelB = getSideLabel(p, "b");
  const labelC = getSideLabel(p, "c");

  ctx.font = "bold 15px sans-serif";

  // 底辺 a (中央下)
  if (labelA) {
    ctx.fillStyle = labelA === "?" ? "#ea580c" : "#1e293b";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(labelA, (leftX + rightX) / 2, baseY + 12);
  }

  // 高さ b (右外側中央)
  if (labelB) {
    ctx.fillStyle = labelB === "?" ? "#ea580c" : "#1e293b";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(labelB, rightX + 12, (baseY + topY) / 2);
  }

  // 斜辺 c (斜辺中央から外側垂直方向へオフセット)
  if (labelC) {
    ctx.fillStyle = labelC === "?" ? "#ea580c" : "#1e293b";
    const midX = (leftX + rightX) / 2;
    const midY = (baseY + topY) / 2;
    // 斜辺の法線ベクトル (外側向き: 上・左方向)
    const hypLen = Math.hypot(drawA, drawB);
    const nx = -drawB / hypLen;
    const ny = -drawA / hypLen;
    const offset = 18;
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillText(labelC, midX + nx * offset, midY + ny * offset);
  }
}

function getSideLabel(p, sideKey) {
  const str = sideToStr(p[sideKey]);
  if (p.mode === "mode1") {
    return str;
  }
  if (p.mode === "mode2") {
    return p.hiddenSide === sideKey ? "?" : str;
  }
  if (p.mode === "mode3") {
    if (p.targetSide === sideKey) return "?";
    // 形式③は1辺と比だけ与えるため、使わない辺は非表示
    if (p.targetRatio === "sin") {
      if (sideKey === "a") return "";
    } else if (p.targetRatio === "cos") {
      if (sideKey === "b") return "";
    } else if (p.targetRatio === "tan") {
      if (sideKey === "c") return "";
    }
    return str;
  }
  return str;
}

function updateText(p) {
  const qEl = document.getElementById("question-text");
  const ansEl = document.getElementById("answer-content");
  const tagEl = document.getElementById("problem-tag");

  const strA = sideToStr(p.a);
  const strB = sideToStr(p.b);
  const strC = sideToStr(p.c);

  if (p.mode === "mode1") {
    tagEl.textContent = "形式①：3辺から三角比を求める";
    qEl.innerHTML = `直角三角形の3辺の長さが与えられています。角 <span class="math-font text-rose-600 font-semibold text-lg">θ</span> に対する <strong>sin θ, cos θ, tan θ</strong> の値をそれぞれ求めなさい。`;

    ansEl.innerHTML = `
      <div class="font-bold text-slate-800 mb-2">【三角比の定義に基づく立式】</div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
        <div class="bg-white p-2.5 rounded border border-blue-200">
          <div class="text-xs text-slate-500 font-medium">sin θ = 対辺 / 斜辺</div>
          <div class="text-base font-bold text-blue-900 mt-1">= ${p.sinVal}</div>
          <div class="text-xs text-slate-400 mt-0.5">(${strB} / ${strC})</div>
        </div>
        <div class="bg-white p-2.5 rounded border border-blue-200">
          <div class="text-xs text-slate-500 font-medium">cos θ = 隣辺 / 斜辺</div>
          <div class="text-base font-bold text-blue-900 mt-1">= ${p.cosVal}</div>
          <div class="text-xs text-slate-400 mt-0.5">(${strA} / ${strC})</div>
        </div>
        <div class="bg-white p-2.5 rounded border border-blue-200">
          <div class="text-xs text-slate-500 font-medium">tan θ = 対辺 / 隣辺</div>
          <div class="text-base font-bold text-blue-900 mt-1">= ${p.tanVal}</div>
          <div class="text-xs text-slate-400 mt-0.5">(${strB} / ${strA})</div>
        </div>
      </div>
    `;
  } else if (p.mode === "mode2") {
    tagEl.textContent = "形式②：2辺から三平方の定理＋三角比";
    qEl.innerHTML = `「<span class="text-orange-600 font-bold">?</span>」の辺の長さを三平方の定理で求めた上で、角 <span class="math-font text-rose-600 font-semibold text-lg">θ</span> に対する <strong>sin θ, cos θ, tan θ</strong> を求めなさい。`;

    let pythDetail = "";
    if (p.hiddenSide === "c") {
      const sum = sideSq(p.a) + sideSq(p.b);
      pythDetail = `斜辺 = √(${strA}² + ${strB}²) = √(${sideSq(p.a)} + ${sideSq(p.b)}) = √${sum} = <strong>${strC}</strong>`;
    } else if (p.hiddenSide === "a") {
      const diff = sideSq(p.c) - sideSq(p.b);
      pythDetail = `底辺 = √(${strC}² - ${strB}²) = √(${sideSq(p.c)} - ${sideSq(p.b)}) = √${diff} = <strong>${strA}</strong>`;
    } else {
      const diff = sideSq(p.c) - sideSq(p.a);
      pythDetail = `対辺(高さ) = √(${strC}² - ${strA}²) = √(${sideSq(p.c)} - ${sideSq(p.a)}) = √${diff} = <strong>${strB}</strong>`;
    }

    ansEl.innerHTML = `
      <div class="font-bold text-slate-800">1. 三平方の定理で未知の辺を求める</div>
      <div class="bg-white p-2.5 rounded border border-blue-200 font-mono text-sm mb-3">${pythDetail}</div>
      <div class="font-bold text-slate-800">2. 得られた3辺から三角比を算出</div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-1">
        <div class="bg-white p-2 rounded border border-blue-200 text-center font-bold text-blue-900">sin θ = ${p.sinVal}</div>
        <div class="bg-white p-2 rounded border border-blue-200 text-center font-bold text-blue-900">cos θ = ${p.cosVal}</div>
        <div class="bg-white p-2 rounded border border-blue-200 text-center font-bold text-blue-900">tan θ = ${p.tanVal}</div>
      </div>
    `;
  } else if (p.mode === "mode3") {
    tagEl.textContent = "形式③：1辺と三角比から他の辺を求める";

    let ratioExp = "";
    let solveExp = "";
    let ansVal = "";

    if (p.targetRatio === "sin") {
      ratioExp = `sin θ = ${p.sinVal}`;
      if (p.targetSide === "b") {
        ansVal = strB;
        solveExp = `(対辺) = (斜辺) × sin θ = ${strC} × (${p.sinVal}) = <strong>${ansVal}</strong>`;
      } else {
        ansVal = strC;
        solveExp = `(斜辺) = (対辺) / sin θ = ${strB} / (${p.sinVal}) = <strong>${ansVal}</strong>`;
      }
    } else if (p.targetRatio === "cos") {
      ratioExp = `cos θ = ${p.cosVal}`;
      if (p.targetSide === "a") {
        ansVal = strA;
        solveExp = `(底辺) = (斜辺) × cos θ = ${strC} × (${p.cosVal}) = <strong>${ansVal}</strong>`;
      } else {
        ansVal = strC;
        solveExp = `(斜辺) = (底辺) / cos θ = ${strA} / (${p.cosVal}) = <strong>${ansVal}</strong>`;
      }
    } else if (p.targetRatio === "tan") {
      ratioExp = `tan θ = ${p.tanVal}`;
      if (p.targetSide === "b") {
        ansVal = strB;
        solveExp = `(対辺) = (底辺) × tan θ = ${strA} × (${p.tanVal}) = <strong>${ansVal}</strong>`;
      } else {
        ansVal = strA;
        solveExp = `(底辺) = (対辺) / tan θ = ${strB} / (${p.tanVal}) = <strong>${ansVal}</strong>`;
      }
    }

    qEl.innerHTML = `図の条件および <span class="bg-blue-50 text-blue-800 px-2 py-0.5 rounded font-mono font-bold">${ratioExp}</span> であるとき、「<span class="text-orange-600 font-bold">?</span>」の辺の長さを求めなさい。`;
    ansEl.innerHTML = `
      <div class="font-bold text-slate-800 mb-1">【三角比による立式と計算】</div>
      <div class="bg-white p-3 rounded border border-blue-200 text-sm leading-relaxed mb-2">
        ${solveExp}
      </div>
      <div class="text-xs text-slate-500">※ 直角三角形の3辺: 底辺 = ${strA}, 高さ = ${strB}, 斜辺 = ${strC}</div>
    `;
  }
}

function refresh() {
  const mode = document.getElementById("mode-select").value;
  currentProblem = generateProblem(mode);
  isAnswerShown = false;
  document.getElementById("answer-container").classList.add("hidden");
  document.getElementById("btn-toggle-ans").textContent = "解説・解答を表示";
  draw(currentProblem);
  updateText(currentProblem);
}

// 解答切り替え
document.getElementById("btn-toggle-ans").addEventListener("click", () => {
  isAnswerShown = !isAnswerShown;
  const container = document.getElementById("answer-container");
  const btn = document.getElementById("btn-toggle-ans");
  if (isAnswerShown) {
    container.classList.remove("hidden");
    btn.textContent = "解説・解答を隠す";
  } else {
    container.classList.add("hidden");
    btn.textContent = "解説・解答を表示";
  }
});

document.getElementById("btn-next").addEventListener("click", refresh);
document.getElementById("mode-select").addEventListener("change", refresh);

// 初期起動
window.addEventListener("DOMContentLoaded", refresh);
</script>
